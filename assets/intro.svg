
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171923"/>
      <stop offset="100%" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="436" rx="14"
        fill="url(#bg)" stroke="#343746" stroke-width="2"/>

  <path d="M16 2 H884 Q898 2 898 16 V48 H2 V16 Q2 2 16 2"
        fill="#242633"/>

  <circle cx="26" cy="25" r="5" fill="#f87171"/>
  <circle cx="44" cy="25" r="5" fill="#fbbf24"/>
  <circle cx="62" cy="25" r="5" fill="#4ade80"/>

  <text x="86" y="30" font-family="monospace" font-size="13"
        fill="#c4c7d4">heychandur@github: ~</text>

  <g font-family="monospace" font-size="15">
    <text x="28" y="82" fill="#a78bfa">$ whoami</text>
    <text x="28" y="111" fill="#f3f4f6">heychandur</text>

    <text x="28" y="137" fill="#9ca3af">
      Electronics and Communication Engineer
    </text>

    <text x="28" y="176" fill="#a78bfa">$ cat interests.txt</text>
    <text x="28" y="202" fill="#d1d5db">
      Coding, building things, and creating practical solutions.
    </text>

    <text x="28" y="242" fill="#a78bfa">$ cat projects.txt</text>

    <text x="28" y="278" fill="#60a5fa">01</text>
    <text x="65" y="278" fill="#f3f4f6">
      ANC using Wiener Filter
    </text>

    <text x="28" y="316" fill="#60a5fa">02</text>
    <text x="65" y="316" fill="#f3f4f6">
      Secure Image Transmission using LSB Steganography
    </text>

    <text x="28" y="354" fill="#60a5fa">03</text>
    <text x="65" y="354" fill="#f3f4f6">
      ESP32 RFID Attendance System
    </text>

    <text x="28" y="400" fill="#a78bfa">$ echo "building, learning, improving"</text>
    <text x="28" y="425" fill="#4ade80">ready to build</text>

    <rect x="164" y="411" width="9" height="17" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1"
               dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
